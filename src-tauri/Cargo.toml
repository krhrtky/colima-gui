[package]
name = "colima-gui"
version = "0.1.0"
description = "A desktop interface for Colima profiles and containers"
rust-version = "1.88"
edition = "2024"

[lib]
name = "colima_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11.6", features = [] }
libc = "0.2"
tauri-plugin-wdio = { version = "=1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
